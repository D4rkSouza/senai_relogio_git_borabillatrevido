<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="imgs/relogio_favi.jpg" type="image/x-icon">
</head>
<body>
    <div class="centro_de_tudo">
        <h1>PAINEL DIGITAL</h1>
        <div>
            <div>
                <span id="hora">00</span>
        </div>
            <span class="dpontos">:</span>
            <div>
                <div>
                <span id="minuto">00</span>
            </div>
        </div>
        <span class="dpontos">:</span>
        <div class="central">
            <div>
                <span id="segundo">00</span>
            </div>
        </div>
    </div>

<hr>

    <div class="data_meio">
        <div>
            <span id="dia_meio">00</span>
        </div>
        <span>/</span>
        <div>
            <span id="mes_meio">00</span>
        </div>
        <span>/</span>
        <div>
            <span id="ano_meio">0000</span>
        </div>
    </div>

<hr>

    <div class="central_data">
        <div>
            <p>Dia</p>
            <span id="dia_detalhado">00</span>
        </div>
        <div>
            <p>Mês</p>
            <span id="mes_detalhado">00</span>
        </div>
        <div>
            <p>Ano</p>
            <span id="ano_detalhado">0000</span>
        </div>
    </div>

    <div class="bom_sla">
        <span id="boas_vindas"></span>
        <p></p>
    </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
